<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"> 
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> 
  <style>
    body {
      transition: background-color 0.3s, color 0.3s;
      margin: 0;
      padding-top: 60px;
    }
    .dark-mode {
      filter: invert(1) hue-rotate(180deg);
    }

    .sidebar {
      height: 100vh;
      width: 250px;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #f8f9fa;
      padding-top: 70px;
      border-right: 1px solid #ddd;
    }

    .sidebar a {
      padding: 15px 20px;
      display: block;
      text-decoration: none;
      color: #333;
    }

    .sidebar a:hover {
      background-color: #e9ecef;
    }

    .main-content {
      margin-left: 250px;
      padding: 20px;
    }

    .container-custom {
      max-width: 900px;
      background-color: white;
      margin: auto;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(0,0,0,0.1);
    }

    .edit-btn {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 14px;
      margin-left: 10px;
    }

    .edit-btn:hover {
      background-color: #2980b9;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1030;
      background-color: #fff;
      border-bottom: 1px solid #dee2e6;
      padding: 10px 20px;
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <div class="topbar d-flex justify-content-between align-items-center bg-light shadow-sm px-4 py-2">
    <h4 class="mb-0">{% block heading %}Dashboard{% endblock %}</h4>
    <div class="d-flex align-items-center gap-3">
      <button id="toggleDarkMode" class="btn btn-outline-dark btn-sm" title="Toggle Dark Mode">🌙</button>
      <div class="dropdown">
        <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle" data-bs-toggle="dropdown">
          <img src="{{ url_for('static', filename='images/Unknown_person.jpg') }}" alt="Avatar"
               class="rounded-circle" style="width: 32px; height: 32px; object-fit: cover;">
        </a>
        <ul class="dropdown-menu dropdown-menu-end">
          <li class="px-3 py-2">
            <strong>{{ user_info.name }}</strong><br>
            <small class="text-muted">{{ user_info.role }}</small>
          </li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item" href="{{ url_for('dashboard') }}"><i class="fas fa-chart-line me-2"></i>Dashboard</a></li>
          <li><a class="dropdown-item" href="{{ url_for('logout') }}"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
        </ul>
      </div>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <a href="{{ url_for('dashboard') }}"><i class="fas fa-home me-2"></i>Dashboard</a>
    <a href="{{ url_for('profile') }}"><i class="fas fa-user me-2"></i>Profile</a>
    <a href="{{ url_for('report_problem') }}"><i class="fas fa-exclamation-circle me-2"></i>Report Problem</a>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    {% block content %}
    <!-- This will be replaced by child templates -->
    {% endblock %}
  </div>

  <!-- Scripts -->
  <script>
    document.getElementById('toggleDarkMode').onclick = () => {
      document.body.classList.toggle('dark-mode');
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> 
</body>
</html>
